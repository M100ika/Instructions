    }

    }

<script>
function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    const link = document.getElementById('nav-' + pageId);
    if (link) link.classList.add('active');
    window.scrollTo(0, 0);
    document.getElementById('mobileNavLinks').style.display = 'none';
    refreshReveal();
}

function toggleMenu() {
    const nav = document.getElementById('mobileNavLinks');
    nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
}

window.addEventListener('resize', () => {
    if (window.innerWidth >= 768) document.getElementById('mobileNavLinks').style.display = 'none';
});

function openModal() {
    const el = document.getElementById('requestModal');
    if (!el) return;
    el.classList.remove('hidden');
    el.classList.add('flex');
}
function closeModal() {
    const el = document.getElementById('requestModal');
    if (!el) return;
    el.classList.add('hidden');
    el.classList.remove('flex');
}

const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('active');
            const line = entry.target.querySelector('.connector-line');
            if (line) line.classList.add('active');
        }
    });
}, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

function refreshReveal() {
    document.querySelectorAll('.page.active .reveal').forEach(el => revealObserver.observe(el));
}
refreshReveal();

window.addEventListener('scroll', () => {
    const header = document.getElementById('site-header');
    if (window.scrollY > 50) {
        header.classList.remove('nav-glass');
        header.classList.add('bg-[#111827]', 'shadow-2xl');
    } else {
        header.classList.add('nav-glass');
        header.classList.remove('bg-[#111827]', 'shadow-2xl');
    }
});
</script>
